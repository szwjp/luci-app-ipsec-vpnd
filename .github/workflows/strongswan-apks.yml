name: Build strongswan apks

# x86_64-only by design. The ImmortalWrt SDK is downloaded pre-built for a
# specific target; switching to another arch means switching the SDK URL,
# not adding a matrix here. If you ever need to build for aarch64/mipsel/
# whatever, duplicate this file and change SDK_URL + the key.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # SDK download is 563 MB. Worst-case 25min, plus ~5-8min compile.
    # 30min total cap: dies fast instead of burning a runner for hours
    # on a CDN outage.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v5

      - name: Install host tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq build-essential file gawk perl zstd

      - name: Cache ImmortalWrt SDK tarball
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: /tmp/sdk.tar.zst
          key: immortalwrt-sdk-25.12.1-x86-64-gcc-14.3.0-musl
          restore-keys: |
            immortalwrt-sdk-

      - name: Download & extract ImmortalWrt SDK 25.12.1 (x86_64)
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/immortalwrt-sdk-25.12.1-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          if [ ! -s /tmp/sdk.tar.zst ]; then
            echo "::group::Downloading SDK (~563 MB)..."
            curl --fail --show-error --location \
              --retry 3 --retry-delay 5 --max-time 1500 \
              -o /tmp/sdk.tar.zst "$SDK_URL"
            echo "::endgroup::"
          else
            echo "Using cached SDK tarball: $(stat -c %s /tmp/sdk.tar.zst 2>/dev/null || stat -f%z /tmp/sdk.tar.zst) bytes"
          fi
          tar --zstd -xf /tmp/sdk.tar.zst -C /tmp
          echo "SDK=$(ls -d /tmp/immortalwrt-sdk-*)" >> "$GITHUB_ENV"

      - name: Prepare feeds, install vendored strongswan, drop bash
        run: |
          cd "$SDK"
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          if ! grep -qE '^src-git[a-z-]*[ \t]+packages ' feeds.conf; then
            echo 'src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12' >> feeds.conf
          fi
          ./scripts/feeds update packages 2>&1 | tail -3
          ./scripts/feeds install -a >/dev/null 2>&1 || true

          # Replace SDK's upstream strongswan (which lives at
          # feeds/packages/net/strongswan) with our vendored copy at the
          # SAME path. This is the path OpenWrt's build system actually
          # walks, so the override sticks — `cp -r` to package/strongswan
          # alone gets shadowed by the symlinked feeds copy.
          rm -rf "$SDK/feeds/packages/net/strongswan"
          cp -r deps/strongswan "$SDK/feeds/packages/net/strongswan"

          # Drop bash entirely. The SDK's feeds/packages/utils/bash
          # links against -lncurses -lreadline, but those libs aren't
          # in this SDK's package set (package/libs/{ncurses,readline}
          # live in OpenWrt main repo only). bash also isn't a runtime
          # dep of anything luci-app-ipsec-vpnd ships. Removing it
          # sidesteps the whole build chain.
          rm -rf "$SDK/feeds/packages/utils/bash"
          find "$SDK/package/feeds" -name "bash" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Configure & compile strongswan
        run: |
          cd "$SDK"
          set -o pipefail

          make defconfig
          # luci-app-ipsec-vpnd's Makefile DEPENDS chain + minimal strongswan
          # plugins. Each is enabled by flipping "# CONFIG_X is not set"
          # → "CONFIG_X=y" in the SDK's default .config.
          for sym in \
            PACKAGE_libgmp \
            PACKAGE_strongswan \
            PACKAGE_strongswan-charon \
            PACKAGE_strongswan-charon-cmd \
            PACKAGE_strongswan-ipsec \
            PACKAGE_strongswan-minimal \
            PACKAGE_strongswan-mod-aes \
            PACKAGE_strongswan-mod-des \
            PACKAGE_strongswan-mod-gmp \
            PACKAGE_strongswan-mod-hmac \
            PACKAGE_strongswan-mod-kdf \
            PACKAGE_strongswan-mod-kernel-libipsec \
            PACKAGE_strongswan-mod-kernel-netlink \
            PACKAGE_strongswan-mod-md5 \
            PACKAGE_strongswan-mod-mgf1 \
            PACKAGE_strongswan-mod-pubkey \
            PACKAGE_strongswan-mod-random \
            PACKAGE_strongswan-mod-sha1 \
            PACKAGE_strongswan-mod-sha2 \
            PACKAGE_strongswan-mod-sha3 \
            PACKAGE_strongswan-mod-socket-default \
            PACKAGE_strongswan-mod-stroke \
            PACKAGE_strongswan-mod-updown \
            PACKAGE_strongswan-mod-x509 \
            PACKAGE_strongswan-mod-xauth-generic \
            PACKAGE_strongswan-mod-xcbc ; do
            sed -i "s/^# CONFIG_${sym} is not set/CONFIG_${sym}=y/" .config
          done
          make defconfig

          echo "--- config dump (关键的 sub-packages / lib) ---"
          grep -E "^CONFIG_PACKAGE_(strongswan|bash|libncurses|libreadline|libgmp|strongswan-gencerts|strongswan-pki|strongswan-swanctl|strongswan-libtls|strongswan-isakmp|strongswan-full|strongswan-default)=" .config || true

          # Dry-run: shows which packages the build is about to walk.
          # If bash/gencerts shows up here, something is wrong.
          echo "--- dry-run: packages about to be compiled ---"
          make -n package/strongswan/compile 2>&1 \
            | grep -oE "package/[^ ]*/compile" \
            | sort -u \
            | head -40 || true

          echo "--- building ---"
          make package/strongswan/compile V=s 2>&1 | tee /tmp/build.log

      - name: Collect apks
        run: |
          mkdir -p /tmp/apks
          find "$SDK" -name '*.apk' -path '*strongswan*' -exec cp -f {} /tmp/apks/ \;
          ls -lh /tmp/apks/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: strongswan-apks
          path: /tmp/apks/*.apk
